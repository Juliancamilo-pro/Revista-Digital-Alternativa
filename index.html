<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Revista Digital Alternativa: periodismo de investigación, opinión, crónica, fotografía, pódcast e infografías sin filtros corporativos."
    />
    <meta name="theme-color" content="#B91C1C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alternativa" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate" type="application/rss+xml" title="Revista Digital Alternativa RSS" href="/rss.xml" />
    <link rel="sitemap" type="application/xml" title="Mapa del sitio" href="/sitemap.xml" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Revista Digital Alternativa" />
    <meta property="og:title" content="Revista Digital Alternativa – Periodismo Independiente y Crítico" />
    <meta
      property="og:description"
      content="Revista Digital Alternativa: periodismo de investigación, opinión, crónica, fotografía, pódcast e infografías sin filtros corporativos."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Revista Digital Alternativa – Periodismo Independiente y Crítico" />
    <meta
      name="twitter:description"
      content="Periodismo independiente de izquierda: investigación, opinión, crónica, fotografía y análisis crítico."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NewsMediaOrganization",
        "name": "Revista Digital Alternativa",
        "description": "Medio digital independiente de izquierda dedicado al periodismo de investigación, opinión, crónica y multimedia sin filtros corporativos.",
        "inLanguage": "es"
      }
    </script>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var isDark = localStorage.getItem('revista_theme') === 'dark';
          if (isDark) root.classList.add('dark');
          var raw = localStorage.getItem('revista_active_theme_cache_v1');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed.id === 'string') {
              root.setAttribute('data-theme', parsed.id);
              var pal = isDark ? parsed.dark : parsed.light;
              if (pal && typeof pal === 'object') {
                var keys = ['primary', 'accent', 'paper', 'ink', 'surface', 'muted', 'glow', 'border'];
                for (var i = 0; i < keys.length; i++) {
                  var k = keys[i];
                  if (typeof pal[k] === 'string') {
                    root.style.setProperty('--editorial-' + k, pal[k]);
                  }
                }
              }
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--editorial-paper)] text-[var(--editorial-ink)] antialiased selection:bg-[var(--editorial-primary)] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
